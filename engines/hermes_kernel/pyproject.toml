[project]
name = "torqclaw-hermes-kernel"
version = "0.1.0"
description = "Thin MCP wrapper around the vendored Hermes agent (NousResearch/hermes-agent)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "jsonschema>=4.21.0",
    # Runtime dependencies of the vendored Hermes agent. Keep these explicit:
    # the wrapper imports Hermes directly rather than installing it as a wheel.
    "openai==2.24.0",
    "python-dotenv==1.2.2",
    "fire==0.7.1",
    "httpx[socks]==0.28.1",
    "rich==14.3.3",
    "tenacity==9.1.4",
    "PyYAML==6.0.3",
    "ruamel.yaml==0.18.17",
    "requests==2.33.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "prompt_toolkit==3.0.52",
    "croniter==6.0.0",
    "packaging==26.0",
    "Markdown==3.10.2",
    "PyJWT[crypto]==2.13.0",
    # Phase 4 signed remote skill sources: Ed25519 verification runs in the
    # kernel. `cryptography` is present transitively via PyJWT[crypto], but
    # relying on a transitive extra for a security control is itself an
    # unenforced claim (PRD R-1) -- pin it explicitly.
    "cryptography>=44,<50",
    "urllib3>=2.7.0,<3",
    "tzdata==2025.3; sys_platform == 'win32'",
    "psutil==7.2.2",
    "pathspec==1.1.1",
    "fastapi>=0.104.0,<1",
    "uvicorn[standard]>=0.24.0,<1",
    "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
    "Pillow==12.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# GS-ACCEPT boots a real AIAgent and renders a real system prompt; it is slower
# and needs the vendored hermes-agent importable. Excluded from the default run
# so `pytest tests` stays the fast unit/integration gate.
# Run it with: pytest tests/acceptance -m acceptance
addopts = "-m 'not acceptance'"
markers = [
    "acceptance: GS-ACCEPT live acceptance -- real AIAgent boot, real rendered prompt",
]
