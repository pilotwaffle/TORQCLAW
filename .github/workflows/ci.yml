name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # Full history: tests/auth-v2-phase1+2a pin historical SHAs and
          # `git show <sha>:...` them; a depth-1 clone makes those fail.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v8.3.2

      - run: uv sync
        working-directory: engines/hermes_kernel

      - run: pnpm --filter @torqclaw/contracts build

      - run: pnpm contracts:check

      # Fails when a substantial module cannot be reached from any real entry
      # point. This repo's recurring defect is strong code wired to nothing:
      # tests pass because they test the module, never the claim that it is
      # part of the system. Dormant-by-design is allowed but must be declared.
      - name: reachability - no undeclared orphan modules
        run: pnpm reachability

      - run: pnpm typecheck

      # vitest aliases resolve into packages/*/dist, and
      # scripts/auth-phase2a-offline.mjs dynamically imports
      # packages/{collab,gateway}/dist at runtime. Without this build the
      # first test worker races the lazy in-test turbo build from
      # tests/helpers/collab-gateway-harness.ts and fails deterministically
      # on a cold runner (the phase2a CLI trace collapses to
      # ['state:REFUSED'] because its dynamic import throws pre-collab:OPEN).
      - run: pnpm --filter @torqclaw/gateway... build

      - run: pnpm test

      - name: python - hermes kernel unit tests
        run: uv run pytest
        working-directory: engines/hermes_kernel

      - run: pnpm build

      - name: e2e - production portable launch (synthetic tokens, stub)
        run: node ops/e2e-production-launch.mjs

      - name: e2e - one-shot prompt
        run: node ops/e2e.mjs

      - name: e2e - approval flow (local edge)
        run: node ops/e2e-approval.mjs

      - name: e2e - approval flow (frontier/cloud)
        run: node ops/e2e-approval-cloud.mjs

      - name: e2e - cancel task
        run: node ops/e2e-cancel.mjs

      - name: e2e - budget circuit breaker
        run: node ops/e2e-budget.mjs

      - name: e2e - http channel adapter
        run: node ops/e2e-channel.mjs
